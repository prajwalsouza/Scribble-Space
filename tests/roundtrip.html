<!doctype html><html><head><meta charset="utf-8"><title>Scribble Space · Browser integration checks</title><script type="importmap">{"imports":{"three":"../vendor/three/build/three.module.js","three/addons/":"../vendor/three/examples/jsm/"}}</script></head><body style="font:14px system-ui"><h1>Browser integration checks</h1><button id="run">Run package and model round trip</button><pre id="results">Ready</pre><div style="width:640px;height:400px"><canvas id="world" style="width:100%;height:100%"></canvas></div><canvas id="sketch" style="max-width:640px"></canvas><script type="module">
import {importPackage,exportPackage} from '../public/handoff.mjs';import {WorldView} from '../public/scene.mjs';import {SketchLayer} from '../public/sketch.mjs';import {normalizeImage} from '../public/persistence.mjs';import {digest,unzipStore} from '../shared/archive.mjs';import {initialWorkspace} from '../shared/workspace.mjs';
const results=document.getElementById('results');const assets=new Map(),docs=[];const store={async put(blob){const id=await digest(await blob.arrayBuffer())+(blob.type==='model/gltf-binary'?'.glb':'.png');assets.set(id,blob);return {id}},async blob(id){return assets.get(id)},async save(d){docs.push(d);return d}};
document.getElementById('run').onclick=async()=>{try{results.textContent='Running…';const bytes=await (await fetch('./fixtures/courtyard.sm3dl.zip')).arrayBuffer();const count=await importPackage(bytes,store);if(count!==1||docs[0].marks.length!==2)throw Error('Import lost marks');const original=unzipStore(bytes),geometry=original['scene.glb'];const model=(await store.put(new Blob([geometry],{type:'model/gltf-binary'}))).id;const view=new WorldView(document.getElementById('world'));await view.setWorkspace({...initialWorkspace('model'),model:{asset:model,name:'Generic scene.glb'}},geometry.buffer);view.frameModel();if(view.meshes.length<10)throw Error('Imported model lost geometry');const capture=await view.capture();if(capture.blob.size<1000)throw Error('Empty model screenshot');const sketch=new SketchLayer(document.getElementById('sketch'));await sketch.open(docs[0],store);const normalized=await normalizeImage(capture.blob);const asset=await store.put(normalized.blob);await sketch.addImage(asset.id,normalized.blob,'Reference');if(docs[0].marks.length!==3)throw Error('Reference image not retained');sketch.undo();if(docs[0].marks.length!==2)throw Error('Undo failed');sketch.redo();const preview=await sketch.preview();docs[0].preview=(await store.put(preview)).id;const packed=await exportPackage([docs[0]],store,{geometry:await view.exportGLB(),spec:'Test profile'});const second=[];await importPackage(await packed.arrayBuffer(),{...store,async save(d){second.push(d)}});if(second[0].marks.length!==3||second[0].camera.quaternion.join()!==docs[0].camera.quaternion.join())throw Error('Round trip changed camera or marks');results.textContent='PASS: imported package and hashes; GLB load/render/export; PNG normalization; reference image add; undo/redo; annotated preview; second export/import; exact camera and mark preservation.'}catch(e){results.textContent='FAIL: '+e.stack;console.error(e)}};
</script></body></html>
